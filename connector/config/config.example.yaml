# ============================================================
# GuardIA Connector — Configuração
# Copie para config.yaml e preencha com suas credenciais
# ============================================================

supabase:
  url: "https://SEU-PROJETO.supabase.co"
  # Use a anon key (publishable key) do Supabase
  # Disponível em: Project Settings → API → Project API keys
  anon_key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

connector:
  id: "connector-bancada-01"
  org_id: "zenite-tech"
  poll_interval_seconds: 30       # Intervalo de polling por câmera
  heartbeat_interval_seconds: 60  # Intervalo de heartbeat
  max_events_per_poll: 50         # Máximo de eventos por requisição
  image_upload: true              # Fazer upload de imagens para Storage
  log_level: "INFO"               # DEBUG, INFO, WARNING, ERROR

# Receptor de push HTTP (P6SHTTP, canal primário — CLAUDE.md §3.2/§4.2)
ingestion:
  http_host: "0.0.0.0"
  http_port: 8443
  http_path: "/p6s/events"
  # [LACUNA] formato exato da assinatura do push ainda não confirmado
  # na bancada. "log_only" aceita o push e loga os parâmetros OAuth
  # recebidos, para revelar o formato real. Trocar para "hmac_sha1"
  # só depois de confirmado (ver connector/src/push_auth.py).
  push_auth_mode: "log_only"
  # Estado de ingestão persistido: dedupe, fila de entrega e payload bruto.
  # Arquivo LOCAL do connector — não é tabela do produto, não esbarra na
  # PND-16. Ver connector/src/ingest_store.py.
  state_db_path: "connector/state/ingest.db"
  # Prazo do payload bruto. CORE-05 §2 propõe 7 dias ("vence antes do
  # metadado; serve para depurar integração, não para operar"). É proposta
  # técnica a validar juridicamente (PND-11), não parecer.
  raw_retention_days: 7

# Túnel MQTT (P6SEventMQTTConfig — CLAUDE.md §3.3), broker EMQX
mqtt:
  enabled: false
  broker_host: "SEU-BROKER-EMQX"
  broker_port: 8883
  use_tls: true
  username: "connector"
  password: "SENHA_MQTT"
  # [LACUNA] tópico exato — confirmar na bancada/config do EMQX
  event_topic_pattern: "p6s/+/events"

